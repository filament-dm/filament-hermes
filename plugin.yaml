# Directory-plugin manifest. `hermes plugins install filament-dm/filament-hermes
# --enable` git-clones this repo into ~/.hermes/plugins/<name>, where Hermes
# discovers it via this manifest plus the root __init__.py. `name` is the plugin
# id: the install directory, the entry in `plugins.enabled`, and the argument to
# `hermes plugins update <id>`.
name: filament
label: Filament (FCM)
kind: platform
# Keep in sync with [project].version in pyproject.toml (pyproject is the
# canonical version _version.py reads; this drives `hermes plugins list`).
version: 0.10.3
author: Filament
description: >
  Hermes gateway adapter that connects your agent to Filament, a multiplayer
  chat platform. Receives messages as Firebase Cloud Messaging
  (FCM) push notifications and sends replies through Filament's MCP-over-HTTP
  agents API. Its Python dependencies ship in the plugin's own vendor/ tree, so
  `hermes plugins install` is the whole installation.

# Prompted for by `hermes plugins install` and saved to ~/.hermes/.env, which is
# what lets the install command connect the agent on its own. The plugin's
# platform stays down until the token is set (check_requirements), so a skipped
# prompt degrades to "not connected yet" rather than a broken gateway.
#
# Only the token. FILAMENT_MCP_URL defaults to production in code and is not
# asked for — it exists for pointing a gateway at a dev cluster, and prompting
# every user for a URL they don't have would be worse than useless.
# FILAMENT_CONTROL_USERS is optional too: the principal (owner) is discovered
# from the MCP get_self call at startup, and the control plane is the
# principal's backchannel room, not an env allowlist.
requires_env:
  - name: FILAMENT_MCP_TOKEN
    description: >-
      the agent token from Filament's connect flow (starts with fmcp_)
    url: https://app.filament.dm
    secret: true
