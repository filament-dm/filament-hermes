---
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run pre-commit checks
        run: uv run --group dev prek run --all-files

  install-sh-bash32:
    name: install.sh under bash 3.2
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm /bin/bash is still 3.2
        # The whole point of this job. If Apple ever ships a newer /bin/bash,
        # this stops covering bash 3.2 and should be retargeted (e.g. at a
        # 3.2 built from source) rather than quietly passing.
        run: |
          /bin/bash --version
          case "$(/bin/bash -c 'echo $BASH_VERSION')" in
            3.2*) ;;
            *) echo "::error::/bin/bash is no longer 3.2; retarget this job" ; exit 1 ;;
          esac

      - name: Parse install.sh
        # Necessary but not sufficient: -n parses without expanding, so it
        # passes even on the here-doc-in-a-substitution bug this job exists for.
        run: /bin/bash -n install.sh

      - name: Run install.sh's dependency-read block
        run: /bin/bash tests/install-dep-read.sh

  plugin-scan:
    name: Hermes plugin security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out upstream Hermes's scanner
        # Through the authenticated checkout rather than the script's own
        # download: raw.githubusercontent.com rate-limits (429) shared runners.
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .hermes-agent
          sparse-checkout: |
            tools/plugin_guard.py
            tools/plugin_guard_context.py
            tools/skills_guard.py
          sparse-checkout-cone-mode: false

      - name: Scan with upstream Hermes's scanner
        # Only a `safe` verdict installs unattended: one HIGH finding (a
        # `caution` verdict) blocks the Hermes portal's install-from-GitHub
        # flow. Scans against hermes-agent main, so a scanner change upstream
        # shows up here before it reaches users.
        run: python3 scripts/plugin-scan.py --hermes-dir .hermes-agent
